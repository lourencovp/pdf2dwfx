[project]
name = "pdf2dwfx"
version = "0.2.0"
description = "Convert vector PDF drawings into DWFx files for municipal architecture submissions"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "lourencovp", email = "66488581+lourencovp@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyclipper>=1.4.0",
    "pymupdf<2",
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
pdf2dwfx = "pdf2dwfx.cli:main"

# The app window (no console window on Windows).
[project.gui-scripts]
pdf2dwfx-app = "pdf2dwfx.gui:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]
