# Build the installable apps on Windows, macOS and Linux, check that each
# converts a drawing with the network blocked, and (for a version tag such
# as v0.1.0) publish them as a GitHub release with SHA-256 checksums and
# build attestations (a GitHub-signed record of where each file was built).
#
# Start it by pushing a tag (git tag v0.1.0 && git push origin v0.1.0), or
# by hand from the Actions tab ("Run workflow") to build without releasing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: pdf2dwfx-windows.exe
          - os: macos-latest
            file: pdf2dwfx-macos.dmg
          # The oldest supported Ubuntu: an AppImage runs on Linux systems at
          # least as new as the one it was built on.
          - os: ubuntu-22.04
            file: pdf2dwfx-linux.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"

      - if: runner.os == 'Linux'
        name: Linux libraries for Qt, and appimagetool (version and checksum pinned)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - run: uv sync --locked
      - run: uv run python packaging/build.py

      # The app must work fully offline: convert a test drawing with the
      # network blocked by the operating system itself.
      - if: runner.os == 'Windows'
        name: Check the app with the network blocked (Windows firewall)
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/release/pdf2dwfx-windows.exe).Path
          New-NetFirewallRule -DisplayName "no network for pdf2dwfx" -Direction Outbound -Program $exe -Action Block | Out-Null
          uv run python packaging/smoke_test.py $exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - if: runner.os == 'macOS'
        name: Check the app with the network blocked (macOS sandbox)
        run: uv run python packaging/smoke_test.py sandbox-exec -p "(version 1)(allow default)(deny network*)" dist/pdf2dwfx.app/Contents/MacOS/pdf2dwfx
      - if: runner.os == 'Linux'
        name: Check the app with the network blocked (no network namespace)
        run: |
          uv run python packaging/smoke_test.py sudo unshare --net env APPIMAGE_EXTRACT_AND_RUN=1 "$PWD/dist/release/pdf2dwfx-linux.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/release/${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
      id-token: write  # sign the attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        working-directory: files
        run: sha256sum pdf2dwfx-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: files/pdf2dwfx-*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "pdf2dwfx $GITHUB_REF_NAME" --generate-notes
