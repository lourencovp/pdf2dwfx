# Run the test suite on Windows, macOS and Linux on every push and pull request.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      # --locked: fail if uv.lock is out of date instead of silently changing it.
      - run: uv sync --locked
      - run: uv run pytest -v
